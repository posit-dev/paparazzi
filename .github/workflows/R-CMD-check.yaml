# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.cran && ', as-cran' || '' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', cpus: 2}
          - {os: windows-latest, r: 'release', cpus: 2}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', cpus: 2}
          - {os: ubuntu-latest,   r: 'release', cpus: 2}
          - {os: ubuntu-latest,   r: 'oldrel-1', cpus: 2}
          # Simulated CRAN: NOT_CRAN is false, so browser and system-tool
          # tests must skip; setup-cran-guard.R fails the run if they don't.
          - {os: ubuntu-latest,   r: 'release', cran: true}
          - {os: macos-latest,    r: 'release', cran: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Each test worker starts Chrome; shared runners can starve concurrent
      # browsers. 2 workers held flake-free on ubuntu (4 vCPUs); macOS has 3
      # vCPUs, so watch its flake rate and revert that entry alone if it slips.
      TESTTHAT_CPUS: ${{ matrix.config.cpus || 1 }}
      # setup-r exports NOT_CRAN=true only when it is not already set, so the
      # as-cran jobs can override it here.
      NOT_CRAN: ${{ matrix.config.cran && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
