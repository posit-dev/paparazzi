<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>paparazzi framing fixture</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
    body {
      height: 2000px;
    }
    /* Elements with integer CSS geometry and distinct colors, placed
       apart so no two boxes overlap. */
    #card {
      position: absolute;
      left: 100px;
      top: 80px;
      width: 120px;
      height: 90px;
      background: rgb(200, 30, 30);
    }
    #small {
      position: absolute;
      left: 400px;
      top: 60px;
      width: 60px;
      height: 45px;
      background: rgb(30, 120, 200);
    }
    #wide {
      position: absolute;
      left: 700px;
      top: 200px;
      width: 120px;
      height: 60px;
      background: rgb(30, 200, 120);
    }
    #corner {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 100px;
      height: 50px;
      background: rgb(120, 30, 200);
    }
    #bound {
      position: absolute;
      left: 200px;
      top: 200px;
      width: 400px;
      height: 400px;
      background: rgb(240, 240, 240);
    }
    #inner-tr {
      position: absolute;
      left: 520px;
      top: 220px;
      width: 40px;
      height: 40px;
      background: rgb(200, 200, 30);
    }
    #low {
      position: absolute;
      left: 50px;
      top: 1500px;
      width: 100px;
      height: 60px;
      background: rgb(200, 120, 30);
    }
    #deep {
      position: absolute;
      left: 100px;
      top: 1940px;
      width: 40px;
      height: 40px;
      background: rgb(30, 200, 200);
    }
    /* Fractional CSS geometry for rounding-vs-bounds coverage; clear
       of every other element's box and asserted pixels. */
    #fractional {
      position: absolute;
      left: 620.4px;
      top: 262.6px;
      width: 200.2px;
      height: 88.8px;
      background: rgb(60, 60, 60);
    }
  </style>
</head>
<body>
  <div id="card"></div>
  <div id="small"></div>
  <div id="wide"></div>
  <div id="corner"></div>
  <div id="bound"></div>
  <div id="inner-tr"></div>
  <div id="low"></div>
  <div id="deep"></div>
  <div id="fractional"></div>
</body>
</html>
