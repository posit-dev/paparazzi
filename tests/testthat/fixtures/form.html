<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>paparazzi value-setting fixture</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    form div { margin-bottom: 0.5em; }
    #editor { border: 1px solid #999; padding: 0.5em; min-height: 2em; }
  </style>
</head>
<body>
  <form id="the-form">
    <div><input type="text" id="text"></div>
    <div><textarea id="textarea"></textarea></div>
    <div>
      <select id="select">
        <option value="">--</option>
        <option value="a">Alpha</option>
        <option value="b">Beta</option>
      </select>
    </div>
    <div><input type="checkbox" id="check"></div>
    <div>
      <input type="radio" name="radio" id="radio1" value="r1">
      <input type="radio" name="radio" id="radio2" value="r2">
      <input type="radio" name="other" id="radio3" value="r3">
      <!-- same name as the formless orphan below: a radio group is
           same tree root AND same form owner AND same name, so these
           must never uncheck each other -->
      <input type="radio" name="orphan" id="orphan-form" value="o2">
    </div>
    <div><input type="range" id="range" min="0" max="100" step="1"></div>
    <div><input type="date" id="date"></div>
    <div><input type="number" id="number" min="0" max="10"></div>
    <div><input type="file" id="file"></div>
    <div><input type="file" id="file-multi" multiple></div>
    <input type="file" class="dupfile">
    <input type="file" class="dupfile">
  </form>

  <!-- Radio groups across form boundaries: form-b and form-c hold
       same-name radios (separate groups), and two name-sharing radios
       sit outside any form, associated with those forms via the
       form="..." attribute (peers via the tree root, not a form). -->
  <form id="form-b">
    <input type="radio" name="shared" id="radio-b1" value="b1">
  </form>
  <form id="form-c">
    <input type="radio" name="shared" id="radio-c1" value="c1">
  </form>
  <input type="radio" name="loose" id="loose-b" value="lb" form="form-b">
  <input type="radio" name="loose" id="loose-c" value="lc" form="form-c">
  <input type="radio" name="orphan" id="orphan-free" value="o1">

  <!-- Framework-style controlled input: the instance-level value
       SETTER is overridden, the way React-style controlled inputs
       install it; the getter stays native, so a genuine set is
       observable through it. A naive `el.value = x` hits the trap and
       does nothing; the native prototype setter must bypass it.
       __pzTraps counts trap hits. -->
  <div><input type="text" id="controlled"></div>

  <div id="editor" contenteditable>old <b>bold</b> text</div>

  <p id="para">not a form control</p>

  <script>
    window.__pzLog = [];
    function __pzLogEvent(e) {
      var el = e.target;
      window.__pzLog.push({
        type: e.type,
        id: el.id || el.className || el.tagName,
        isTrusted: e.isTrusted,
        value: e.type === "input" && el.value !== undefined
          ? el.value
          : el.isContentEditable ? el.textContent : null,
        checked: "checked" in el ? el.checked : null
      });
    }
    ["input", "change"].forEach(function (t) {
      document.addEventListener(t, __pzLogEvent, true);
    });

    // The controlled input: instance-level setter override, native
    // getter kept.
    var controlled = document.getElementById("controlled");
    window.__pzTraps = 0;
    Object.defineProperty(controlled, "value", {
      get: Object.getOwnPropertyDescriptor(
        HTMLInputElement.prototype,
        "value"
      ).get,
      set: function () { window.__pzTraps++; }
    });
  </script>
</body>
</html>
