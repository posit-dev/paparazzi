<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>paparazzi advanced interactions fixture</title>
  <style>
    body { font-family: sans-serif; margin: 1em; }
    .spacer { height: 2500px; }
    #scroller { height: 150px; overflow-y: auto; border: 1px solid #999; }
    #scroller .inner { height: 1200px; background: linear-gradient(#8ac, #468); }
    #editor { border: 1px solid #999; min-height: 2em; padding: 0.25em; }
    #dragbox { width: 60px; height: 40px; background: #a86; position: absolute; left: 700px; top: 200px; }
    #draggable, #draggable-uc { width: 60px; height: 40px; background: #8ac; }
    #dropzone { width: 120px; height: 80px; background: #caa; margin-top: 40px; }
  </style>
</head>
<body>
  <!-- select_text: the match "galapagos penguins" crosses em and
       strong text nodes; the editor covers type-after-select. -->
  <p id="rich">The <em>galapagos</em> <strong>penguins</strong> waddle.</p>
  <div id="editor" contenteditable="true">otters are playful</div>
  <p class="dup-select">duplicate one</p>
  <p class="dup-select">duplicate two</p>

  <!-- drag: mouse-path box, then an HTML5 draggable and dropzone.
       Both drag halves stay near the top: a source and a destination
       on opposite sides of the tall spacer below can't share one
       viewport, and neither can a real user's single drag. -->
  <div id="dragbox">drag me</div>
  <div id="draggable" draggable="true">html5 drag me</div>
  <div id="draggable-uc" draggable="TRUE">uppercase drag me</div>
  <div id="dropzone">drop here</div>

  <!-- scroll: a scrollable inner container, then a tall page. -->
  <div id="scroller">
    <div class="inner"></div>
    <p id="deep-item">deep in the scroller</p>
  </div>
  <div class="spacer"></div>
  <p id="tall-bottom">bottom of the tall page</p>

  <script>
    // Event sink for the advanced interaction tests. Records real
    // (trusted) browser events into window.__pzAdvLog.
    window.__pzAdvLog = [];
    function __pzAdvLogEvent(e) {
      window.__pzAdvLog.push({
        type: e.type,
        id: e.target.id || e.target.className || e.target.tagName,
        isTrusted: e.isTrusted
      });
    }
    [
      "mousedown",
      "mouseup",
      "mousemove",
      "dragstart",
      "dragend",
      "dragenter",
      "dragover",
      "drop"
    ].forEach(function (t) {
      document.addEventListener(t, __pzAdvLogEvent);
    });

    // Mouse-path drag: #dragbox follows the pointer while the button
    // is held, so a test can assert where a drag left it.
    var box = document.getElementById("dragbox");
    var held = false;
    var grabX = 0, grabY = 0;
    box.addEventListener("mousedown", function (e) {
      held = true;
      grabX = e.clientX - box.getBoundingClientRect().left;
      grabY = e.clientY - box.getBoundingClientRect().top;
    });
    document.addEventListener("mouseup", function () { held = false; });
    document.addEventListener("mousemove", function (e) {
      if (held) {
        // Absolute positioning: style.left/top are document
        // coordinates, so the box follows the pointer from the grab
        // offset exactly and ends centered under the drop point.
        box.style.left = e.clientX - grabX + window.scrollX + "px";
        box.style.top = e.clientY - grabY + window.scrollY + "px";
      }
    });

    // HTML5 drag-and-drop with a real payload. The dropzone cancels
    // dragover, as real drop zones must -- without that, drop never
    // fires.
    ["draggable", "draggable-uc"].forEach(function (id) {
      document.getElementById(id).addEventListener("dragstart", function (e) {
        e.dataTransfer.setData(
          "text/plain",
          id === "draggable" ? "payload-123" : "payload-uc"
        );
      });
    });
    var zone = document.getElementById("dropzone");
    zone.addEventListener("dragover", function (e) { e.preventDefault(); });
    zone.addEventListener("drop", function (e) {
      e.preventDefault();
      zone.textContent = "got:" + e.dataTransfer.getData("text/plain");
    });
  </script>
</body>
</html>
