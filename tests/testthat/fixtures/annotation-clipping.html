<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fractional annotation clipping</title>
  <style>
    body { margin: 0; background: white; }
    #clip {
      position: absolute;
      left: 100.25px;
      top: 100.25px;
      width: 100.25px;
      height: 80.25px;
      border: 1px solid white;
      overflow: hidden;
      transform: scale(1.1);
      transform-origin: top left;
    }
    #clip::-webkit-scrollbar { width: 13px; height: 11px; background: white; }
    #target { position: relative; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="clip"><div id="target"></div></div>
</body>
</html>
