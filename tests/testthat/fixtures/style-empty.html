<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Empty body fixture</title>
  <!-- Formatting is load-bearing: whitespace before <body> or after
       </body> is moved into the body by the HTML parser, and a
       trailing newline after </html> lands there too, either of which
       would break body:empty. Keep </head><body></body></html> on one
       line with no newline at EOF. -->
</head><body></body></html>
