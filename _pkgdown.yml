url: https://posit-dev.github.io/paparazzi/

template:
  bootstrap: 5
  light-switch: true
  includes:
    in_header: |
      <script defer src="https://cdn.jsdelivr.net/gh/posit-dev/supported-by-posit/js/badge.min.js" data-max-height="43" data-light-bg="#666f76" data-light-fg="#f9f9f9"></script>

articles:
  - title: Guides
    navbar: ~
    contents:
      - articles/walkthrough
      - articles/annotations
      - articles/shiny

  - title: For coding agents
    desc: >
      These vignettes mirror the paparazzi agent skill shipped in the package.
      The Guides above are the human-first documentation with screenshots.
      btw finds the skill automatically when paparazzi is attached;
      `btw::btw_skill_install_package("paparazzi")` copies it into a skills
      directory. Other agents can copy the directory returned by
      `system.file("skills/paparazzi", package = "paparazzi")`.
    contents:
      - agent-overview
      - agent-pages-and-serving
      - agent-locators-and-scopes
      - agent-testing
      - agent-shiny

reference:
  - title: Pages, apps and navigation
    desc: >
      Open a page, a Shiny app, a Quarto document or a static site to start a
      chain. Set the page's size and display settings, and move between
      pages.
    contents:
      - pz_open
      - pz_close
      - pz_example
      - pz_with_page
      - pz_serve_shiny
      - pz_serve_quarto
      - pz_serve_static
      - pz_device
      - pz_nav_goto

  - title: Screenshots and recording
    desc: >
      Capture the page as a PNG screenshot or record it as an MP4, WebM or
      GIF video. `pz_stage()` sets how actions look while recording: the
      cursor, the typing speed and the pause after each step.
    contents:
      - pz_record
      - pz_screenshot
      - pz_stage
      - pz_record_start
      - pz_record_stop
      - pz_record_pause
      - pz_record_hold

  - title: Actions
    desc: >
      Use the page the way a person would: click, type, press keys, scroll and
      drag. While recording, actions are staged. The `pz_set_*()` functions
      set values directly instead.
    contents:
      - paparazzi-actions
      - pz_act_click
      - pz_act_type
      - pz_act_press
      - pz_act_hover
      - pz_act_scroll
      - pz_act_drag
      - pz_act_select_text
      - pz_act_focus
      - pz_act_blur
      - pz_set_value
      - pz_set_shiny_input
      - pz_set_files

  - title: Annotations
    desc: >
      Mark elements, point at them with callouts, spotlight or redact them,
      and add captions. Annotations appear in screenshots and recordings.
      `pz_stage_annotate()` sets their default styles.
    contents:
      - pz_annotate
      - pz_annotate_callout
      - pz_annotate_spotlight
      - pz_annotate_redact
      - pz_annotate_caption
      - pz_annotate_clear
      - pz_stage_annotate

  - title: Framing and camera
    desc: >
      Choose the part of the page that a screenshot or recording shows with
      `pz_frame()`, and set a default for the page with `pz_stage_frame()`.
      During a recording, the camera zooms in on part of the frame and back
      out without changing the live page.
    contents:
      - pz_frame
      - pz_stage_frame
      - pz_camera
      - pz_camera_reset

  - title: Cursor
    desc: >
      Show, move and hide the cursor drawn over the page. Its speed and size
      are set with `pz_stage()`.
    contents:
      - pz_cursor_show
      - pz_cursor_move
      - pz_cursor_leave
      - pz_cursor_hide

  - title: Finding elements
    desc: >
      Describe elements with reusable specs, and narrow a chain to part of the
      page with scopes.
    contents:
      - pz_loc
      - pz_find
      - pz_find_first
      - pz_find_last
      - pz_find_nth
      - pz_find_pop
      - pz_find_reset

  - title: Expectations
    desc: >
      Check the page, retrying until the check passes or times out. Inside
      testthat, expectations count as test expectations.
    contents:
      - starts_with("pz_expect_")

  - title: Waits
    desc: >
      Wait for the page to settle when there's no specific value to expect.
    contents:
      - pz_wait
      - starts_with("pz_wait_for_")

  - title: Getters
    desc: >
      Read values from the page. Getters return values, so they end the chain.
    contents:
      - starts_with("pz_get_")

  - title: Escape hatches and debugging
    contents:
      - pz_inspect
      - pz_js
      - pz_chromote
